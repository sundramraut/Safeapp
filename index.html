
<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe App (Interactive)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#f7f5f0}
.screen{display:none}
.active{display:block}
.nav{position:fixed;bottom:0;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 0}
button{padding:10px 15px;border:none;background:#4a7c6f;color:#fff;border-radius:8px;cursor:pointer}
.card{background:#fff;margin:15px;padding:15px;border-radius:12px}
</style>
</head>
<body><!-- HOME --><div id="home" class="screen active">
  <h2 style="padding:15px">Safe</h2>
  <div class="card">
    <h3>Angela M. (RN)</h3>
    <p>⭐ 4.9 | $55/hr</p>
    <button onclick="showScreen('profile')">View Profile</button>
  </div>
</div><!-- PROFILE --><div id="profile" class="screen">
  <h2 style="padding:15px">Profile</h2>
  <div class="card">
    <h3>Angela M.</h3>
    <p>Registered Nurse</p>
    <p>✔ Verified | ✔ Background Checked</p>
    <button onclick="alert('Booking Confirmed!')">Book Now</button>
  </div>
</div><!-- POST --><div id="post" class="screen">
  <h2 style="padding:15px">Post a Case</h2>
  <div class="card">
    <p>Need a nurse?</p>
    <button onclick="alert('Case Posted!')">Post</button>
  </div>
</div><!-- NAVIGATION --><div class="nav">
  <button onclick="showScreen('home')">Home</button>
  <button onclick="showScreen('profile')">Profile</button>
  <button onclick="showScreen('post')">Post</button>
</div><script>
function showScreen(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
}
</script></body>
</html>
