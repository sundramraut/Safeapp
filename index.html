
<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFE App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }header {
  background: #0A1F44;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.tagline {
  font-size: 14px;
  opacity: 0.8;
}

.container {
  padding: 15px;
}

.search-box {
  margin: 15px 0;
}

.search-box input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.category {
  background: white;
  padding: 10px 15px;
  border-radius: 20px;
  border: 1px solid #ddd;
  white-space: nowrap;
  cursor: pointer;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-top: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.name {
  font-weight: bold;
  margin-top: 10px;
}

.role {
  color: gray;
  font-size: 14px;
}

.badges {
  margin-top: 8px;
  font-size: 12px;
  color: green;
}

.btn {
  margin-top: 10px;
  display: block;
  text-align: center;
  padding: 10px;
  background: #2ECC71;
  color: white;
  border-radius: 10px;
  text-decoration: none;
}

  </style>
</head>
<body><header>
  <h1>SAFE</h1>
  <div class="tagline">Trusted care. Verified professionals.</div>
</header><div class="container">  <div class="search-box">
    <input type="text" placeholder="What care do you need?">
  </div>  <div class="categories">
    <div class="category">Caregiver</div>
    <div class="category">Nurse</div>
    <div class="category">Companion</div>
    <div class="category">Elder Care</div>
  </div>  <div class="card">
    <img src="https://via.placeholder.com/300" alt="provider">
    <div class="name">Angela M.</div>
    <div class="role">Registered Nurse</div>
    <div>⭐ 4.9 | $55/hr</div>
    <div class="badges">✔ Verified | ✔ Background Checked</div>
    <a href="#" class="btn">View Profile</a>
  </div>  <div class="card">
    <img src="https://via.placeholder.com/300" alt="provider">
    <div class="name">John D.</div>
    <div class="role">Caregiver</div>
    <div>⭐ 4.7 | $25/hr</div>
    <div class="badges">✔ Verified | ✔ CPR Certified</div>
    <a href="#" class="btn">View Profile</a>
  </div></div></body>
</html>
