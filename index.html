<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e1117" />
  <meta name="description" content="Safe — Trusted care, verified professionals, right when you need them." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Safe" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />

  <title>Safe</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0e1117;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Splash shown before React loads */
    #splash {
      position: fixed;
      inset: 0;
      background: #0e1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -3px;
      line-height: 1;
      animation: breathe 2s ease-in-out infinite;
    }
    #splash-logo span { color: #4a7c6f; }
    #splash-tagline {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    #splash-dots { display: flex; gap: 6px; margin-top: 6px; }
    #splash-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4a7c6f;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    #splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.55} }
    @keyframes dot-pulse {
      0%,80%,100% { opacity:0.2; transform:scale(0.8); }
      40% { opacity:1; transform:scale(1.2); }
    }

    #root { min-height: 100vh; background: #f7f5f0; }
  </style>
</head>
<body>

  <div id="splash">
    <div id="splash-logo">S<span>a</span>fe</div>
    <div id="splash-tagline">Trusted Care Platform</div>
    <div id="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="root"></div>

  <script>
    // Call window.__hideSplash() from App.js once React is ready
    window.__hideSplash = function () {
      var el = document.getElementById('splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 450);
      }
    };
  </script>

</body>
</html>
